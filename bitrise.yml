name: Build APK (Bitrise Config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-file-path: android_remote/build.gradle
          arguments: assembleRelease
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android_remote/app/build/outputs/apk/release/app-release.apk
