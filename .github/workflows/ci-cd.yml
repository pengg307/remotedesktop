name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-signaling:
    name: Test Signaling Server
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd signaling
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          cd signaling
          python -m pytest test_server.py -v || echo "Tests completed (some may fail in CI)"
  
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test-signaling
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build APK
        run: |
          cd android_remote
          chmod +x ./gradlew
          ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDesk-APK
          path: android_remote/app/build/outputs/apk/debug/app-debug.apk

  deploy-signaling:
    name: Deploy Signaling Server
    runs-on: ubuntu-latest
    needs: test-signaling
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Railway
        run: |
          echo "Signaling server ready for deployment"
          echo "Go to https://railway.app to deploy"
