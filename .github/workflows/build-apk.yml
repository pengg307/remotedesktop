name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Download Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-7.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-7.5/bin" >> $GITHUB_PATH
      
      - name: Build APK
        run: |
          cd android_remote
          gradle assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-remote-desktop-apk
          path: android_remote/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
