name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Download Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
        unzip -q gradle-7.5-bin.zip
        export GRADLE_HOME=$PWD/gradle-7.5
        export PATH=$GRADLE_HOME/bin:$PATH
    
    - name: Build APK
      run: |
        export GRADLE_HOME=$PWD/gradle-7.5
        export PATH=$GRADLE_HOME/bin:$PATH
        cd android_remote
        gradle assembleRelease
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_x64 }}
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-remote-desktop-apk
        path: android_remote/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
