name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.10.0'
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      working-directory: ./flutter_remote
      run: flutter pub get
        
    - name: Build APK
      working-directory: ./flutter_remote
      run: flutter build apk --release
      env:
        FLUTTER_HOST: Android-Studio
          
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: remote-desktop-apk
        path: flutter_remote/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
