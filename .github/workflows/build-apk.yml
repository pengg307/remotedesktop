name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Download Gradle
      run: |
        curl -sL https://services.gradle.org/distributions/gradle-7.5-bin.zip -o gradle.zip
        unzip -q gradle.zip
        echo "GRADLE_HOME=$PWD/gradle-7.5" >> $GITHUB_ENV
        echo "$PWD/gradle-7.5/bin" >> $GITHUB_PATH
    
    - name: Show environment
      run: |
        echo "Java version:"
        java -version
        echo ""
        echo "Gradle version:"
        gradle --version
        echo ""
        echo "Project structure:"
        ls -la android_remote/
        echo ""
        cat android_remote/build.gradle
    
    - name: Build APK
      run: |
        cd android_remote
        gradle assembleRelease --info --stacktrace 2>&1 | tee build.log
        echo "Exit code: $?"
      env:
        ANDROID_HOME: /opt/hostedtoolcache/android-sdk
        JAVA_HOME: ${{ env.JAVA_HOME_17_x64 }}
      
    - name: Check output
      if: always()
      run: |
        echo "Build log:"
        cat android_remote/build.log | tail -100
        echo ""
        echo "Output files:"
        find android_remote/app/build -name "*.apk" 2>/dev/null || echo "No APK found"
      
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: android-remote-desktop-apk
        path: android_remote/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
