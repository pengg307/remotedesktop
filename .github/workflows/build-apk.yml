name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install build tools
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
    
    - name: Build APK with Gradle
      run: ./gradlew assembleRelease --info --stacktrace
      working-directory: ./android_remote
      
    - name: Check output
      run: ls -la app/build/outputs/apk/release/
      working-directory: ./android_remote
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: android-remote-desktop-apk
        path: android_remote/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
