name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip
          echo "$PWD/gradle-7.5/bin" >> $GITHUB_PATH
      
      - name: Build
        run: |
          cd android_remote
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          echo "Exit: $?"
        env:
          ANDROID_HOME: /opt/hostedtoolcache/android-sdk
        
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android_remote/app/build/outputs/apk/release/app-release.apk
