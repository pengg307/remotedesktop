name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Build APK
      uses: vagtg01/gradle-action@v1.0.1
      with:
        build_command: ./gradlew assembleRelease
        working_directory: android_remote
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-remote-desktop-apk
        path: android_remote/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
