name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Run gradle tasks
      uses: gradle/actions/setup-gradle@v3
      with:
        build-root-directory: ./android_remote
    
    - name: Build APK
      run: ./gradlew assembleRelease
      working-directory: ./android_remote
      env:
        ANDROID_HOME: /opt/hostedtoolcache/android-sdk
        ANDROID_SDK_ROOT: /opt/hostedtoolcache/android-sdk
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: android-remote-desktop-apk
        path: android_remote/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
