name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
      working-directory: ./flutter_remote
    
    - name: Build APK
      run: flutter build apk --release
      working-directory: ./flutter_remote
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: remote-desktop-apk
        path: flutter_remote/build/app/outputs/flutter-apk/app-release.apk
