name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android_remote/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    # Use Docker-based approach with pre-built Android image
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build and run in Android container
        run: |
          # 使用Google官方Android构建容器
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/android_remote \
            -e ANDROID_HOME=/opt/android \
            -e JAVA_HOME=/usr/local/openjdk-17 \
            google/android-emulator-containerci-tools:latest \
            bash -c "
              echo '=== Setting up environment ==='
              apt-get update && apt-get install -y android-sdk
              export ANDROID_HOME=/usr/lib/android-sdk
              yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
              $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-34' >/dev/null 2>&1 || true
              $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'build-tools;34.0.0' >/dev/null 2>&1 || true
              echo '=== Building APK ==='
              chmod +x gradlew
              ./gradlew assembleDebug --no-daemon
              echo '=== Checking output ==='
              ls -la app/build/outputs/apk/debug/
            "
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_remote/app/build/outputs/apk/debug/app-debug.apk
