name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android_remote/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          export ANDROID_HOME=/usr/lib/android-sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          # 接受所有许可证
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          # 安装构建工具
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" >/dev/null 2>&1 || \
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" >/dev/null 2>&1 || \
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" >/dev/null 2>&1 || true
      
      - name: Build APK
        working-directory: android_remote
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        timeout-minutes: 20
      
      - name: Check APK exists
        working-directory: android_remote
        run: ls -la app/build/outputs/apk/debug/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_remote/app/build/outputs/apk/debug/app-debug.apk
