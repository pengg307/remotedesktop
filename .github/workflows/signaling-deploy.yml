name: Deploy Signaling Server

on:
  push:
    branches: [main]
    paths:
      - 'signaling/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r signaling/requirements.txt
          python -m py_compile signaling/server.py
          echo "✓ Code validation passed"
      
      - name: Test signaling server
        run: |
          cd signaling
          python -c "from server import app, SignalingServer, Config; print(f'✓ Import OK: port={Config.PORT}')"
      
      - name: Deploy to Railway (manual)
        run: |
          echo "✓ Code is ready for deployment"
          echo "Deploy to Railway: https://railway.app"
          echo "Deploy to Fly.io: fly apps create --name remotedesk-signaling && fly deploy"
          echo "Deploy to Render: https://render.com"
