[project]
name = "remotedesk-pyhost"
version = "1.0.0"
description = "Windows Remote Desktop Host with Cloud Signaling"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9.0",
    "aiortc>=1.9.0",
    "mss>=9.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "websockets>=13.0",
]

[project.scripts]
remotedesk-host = "host:main"